<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
:root { --bg: #0D0D12; --bg2: #1A1A24; --accent: #FF3B5C; --ink: #FFFFFF; --text: #FFFFFF; --font-display: "Chakra Petch", sans-serif; --font-body: "Be Vietnam Pro", sans-serif; --font-number: "Chakra Petch", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); }
.dial { position: absolute; }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-number); font-weight: 700; font-variant-numeric: tabular-nums; }
.reveal { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; }
.big { font-family: var(--font-display); font-weight: 700; line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
.sub { font-weight: 600; opacity: 0.85; text-wrap: balance; }
</style>
</head>
<body>
<div class="dial" id="dial">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="none" stroke="var(--bg2)" stroke-width="3"/>
    <circle id="arc" cx="50" cy="50" r="46" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" transform="rotate(-90 50 50)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
  </svg>
  <div class="num" id="num"></div>
</div>
<div class="reveal" id="reveal"><div class="big" id="big"></div><div class="sub" id="sub"></div></div>
<script>
const k = window.cwKit;
k.vars();
const S = (window.CW_DATA && window.CW_DATA.seconds) || window.CW.seconds;
const $ = (id) => document.getElementById(id);
const from = Math.max(2, Math.min(9, parseInt(k.field('from', '3'), 10) || 3));
// Mỗi số 0,7 giây; phần còn lại (≥ 1,2 giây) cho dòng lộ diện.
const STEP = Math.min(0.7, Math.max(0.45, (S - 1.2) / from));
const TR = from * STEP;
$('big').textContent = k.field('reveal', 'MỞ BÁN');
k.text('#sub', 'sub');
let laid = false;
function layout() {
  laid = true;
  const W = k.W;
  const H = k.H;
  const safe = k.safe;
  const d = Math.min(W - safe.left - safe.right, k.vmin * 74);
  const dial = $('dial');
  dial.style.width = d + 'px';
  dial.style.height = d + 'px';
  dial.style.left = (W - d) / 2 + 'px';
  dial.style.top = safe.top + (H - safe.top - safe.bottom - d) * 0.45 + 'px';
  $('num').style.fontSize = d * 0.52 + 'px';
  const width = W - safe.left - safe.right;
  const reveal = $('reveal');
  reveal.style.left = safe.left + 'px';
  reveal.style.width = width + 'px';
  k.fit($('big'), { max: k.vmin * 28, min: k.vmin * 10, maxWidth: width * 0.96 });
  $('sub').style.fontSize = k.vmin * 5.4 + 'px';
  $('sub').style.marginTop = k.vmin * 4 + 'px';
  const h = reveal.getBoundingClientRect().height;
  reveal.style.top = safe.top + (H - safe.top - safe.bottom - h) * 0.45 + 'px';
}
for (let i = 0; i < from; i += 1) cwSfx(i === from - 1 ? 'tock' : 'tick', i * STEP);
cwSfx('boom', TR, 0.9);
window.cwFrame = (t) => {
  if (!laid) layout();
  const i = Math.min(from - 1, Math.floor(t / STEP));
  const local = t - i * STEP;
  const counting = t < TR;
  const num = $('num');
  num.textContent = String(from - i);
  // Số mới phóng 1,25 → 1 trong 0,22 giây; 0,12 giây cuối mỗi nhịp mờ xuống.
  const pin = k.ease.outCubic(k.clamp(local / 0.22));
  const pout = k.clamp((local - (STEP - 0.12)) / 0.12);
  num.style.opacity = String(counting ? pin * (1 - pout) : 0);
  num.style.transform = 'scale(' + (k.lerp(1.25, 1, pin) - pout * 0.15) + ')';
  $('arc').setAttribute('stroke-dashoffset', String(100 - 100 * k.clamp(t / TR)));
  $('dial').style.opacity = String(counting ? 1 : Math.max(0, 1 - (t - TR) / 0.15));
  // Lộ diện: vòng thu lại, chữ đập vào (không chớp nền — chớp sáng là lỗi bị bắt khi kiểm).
  $('dial').style.transform = counting ? 'scale(1)' : 'scale(' + Math.max(0, 1 - (t - TR) / 0.15) + ')';
  const pr = k.clamp((t - TR) / 0.35);
  const out = k.clamp((t - (S - 0.3)) / 0.3);
  $('reveal').style.opacity = String((pr > 0 ? 1 : 0) * (1 - k.ease.inCubic(out)));
  $('big').style.transform = 'scale(' + k.keys(pr, [[0, 1.5], [0.7, 0.97, k.ease.outQuart], [1, 1]]) + ')';
  const ps = k.ease.outCubic(k.clamp((t - TR - 0.35) / 0.4));
  $('sub').style.opacity = String(ps);
  $('sub').style.transform = 'translateY(' + (1 - ps) * k.vmin * 3 + 'px)';
};
</script>
</body>
</html>
