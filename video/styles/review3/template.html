<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
:root { --bg: #FFFFFF; --bg2: #F3F4F6; --accent: #F59E0B; --ink: #FFFFFF; --text: #111827; --font-display: "Be Vietnam Pro", sans-serif; --font-body: "Be Vietnam Pro", sans-serif; --font-number: "Barlow Condensed", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); }
.title { position: absolute; text-wrap: balance; font-family: var(--font-display); font-weight: 800; line-height: 1.08; letter-spacing: -0.02em; }
.list { position: absolute; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; background: var(--bg2); border-radius: 2.2vmin; }
.row b { flex: none; display: flex; align-items: center; justify-content: center; border-radius: 1.6vmin; background: var(--accent); color: var(--ink); font-family: var(--font-number); font-weight: 800; }
.row span { text-wrap: pretty; font-weight: 600; line-height: 1.25; }
.row svg { flex: none; margin-left: auto; }
.rating { position: absolute; display: flex; align-items: center; }
.stars { position: relative; display: inline-block; white-space: nowrap; letter-spacing: 0.06em; color: var(--bg2); -webkit-text-stroke: 0.04em color-mix(in srgb, var(--text) 18%, transparent); }
.stars i { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: var(--accent); font-style: normal; -webkit-text-stroke: 0; }
.score { font-family: var(--font-number); font-weight: 800; }
.verdict { position: absolute; font-weight: 700; }
</style>
</head>
<body>
<div class="title" id="title"></div>
<div class="list" id="list"></div>
<div class="rating" id="rating"><span class="stars" id="stars">★★★★★<i id="fill">★★★★★</i></span><span class="score" id="score"></span></div>
<div class="verdict" id="verdict"></div>
<script>
const k = window.cwKit;
k.vars();
const S = (window.CW_DATA && window.CW_DATA.seconds) || window.CW.seconds;
const $ = (id) => document.getElementById(id);
const defaults = ['Vải mát, thấm hút tốt', 'Form chuẩn, không nhăn', 'Giá hợp lý cho chất lượng'];
const points = ['p1', 'p2', 'p3'].map((key, i) => k.field(key, defaults[i]));
const rows = points.map((text, i) => {
  const row = document.createElement('div');
  row.className = 'row';
  const num = document.createElement('b');
  num.textContent = String(i + 1);
  const span = document.createElement('span');
  span.textContent = text;
  const check = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  check.setAttribute('viewBox', '0 0 24 24');
  check.innerHTML = '<path d="M4 12.5 L9.5 18 L20 6.5" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>';
  row.appendChild(num);
  row.appendChild(span);
  row.appendChild(check);
  $('list').appendChild(row);
  return row;
});
const ratingText = k.field('rating');
const ratingValue = Math.max(0, Math.min(5, parseFloat(ratingText.replace(',', '.')) || 0));
$('score').textContent = ratingText ? (/\//.test(ratingText) ? ratingText : ratingText + '/5') : '';
if (!ratingText) $('rating').style.display = 'none';
k.text('#verdict', 'verdict');
let titleLines = [];
let laid = false;
function layout() {
  laid = true;
  const W = k.W;
  const H = k.H;
  const safe = k.safe;
  const left = Math.max(safe.left, W * 0.07);
  const width = W - left - Math.max(safe.right, W * 0.07);
  const title = $('title');
  title.style.left = left + 'px';
  title.style.width = width + 'px';
  title.textContent = k.field('title', 'Review thật sau 1 tuần');
  k.fit(title, { max: k.vmin * 11, min: k.vmin * 6.5, maxWidth: width, maxHeight: k.vmin * 11 * 2.3 });
  titleLines = k.lines(title);
  const list = $('list');
  list.style.left = left + 'px';
  list.style.width = width + 'px';
  list.style.gap = k.vmin * 3 + 'px';
  for (const row of rows) {
    row.style.padding = k.vmin * 3.4 + 'px ' + k.vmin * 3.6 + 'px';
    row.style.gap = k.vmin * 3.4 + 'px';
    const num = row.querySelector('b');
    num.style.width = k.vmin * 10 + 'px';
    num.style.height = k.vmin * 10 + 'px';
    num.style.fontSize = k.vmin * 7 + 'px';
    const svg = row.querySelector('svg');
    svg.style.width = k.vmin * 7 + 'px';
    svg.style.height = k.vmin * 7 + 'px';
    k.fit(row.querySelector('span'), { max: k.vmin * 5.6, min: k.vmin * 4, maxWidth: width - k.vmin * 28, maxHeight: k.vmin * 5.6 * 2.6 });
  }
  const rating = $('rating');
  rating.style.left = left + 'px';
  rating.style.gap = k.vmin * 3 + 'px';
  $('stars').style.fontSize = k.vmin * 8 + 'px';
  $('score').style.fontSize = k.vmin * 8 + 'px';
  const verdict = $('verdict');
  verdict.style.left = left + 'px';
  verdict.style.width = width + 'px';
  verdict.style.fontSize = k.vmin * 5 + 'px';
  const titleH = title.getBoundingClientRect().height;
  const listH = list.getBoundingClientRect().height;
  const rateH = ratingText ? rating.getBoundingClientRect().height + k.vmin * 6 : 0;
  const verdictH = verdict.textContent ? verdict.getBoundingClientRect().height + k.vmin * 4 : 0;
  const block = titleH + k.vmin * 7 + listH + rateH + verdictH;
  const top = safe.top + Math.max(0, (H - safe.top - safe.bottom - block) * 0.45);
  title.style.top = top + 'px';
  list.style.top = top + titleH + k.vmin * 7 + 'px';
  rating.style.top = top + titleH + k.vmin * 7 + listH + k.vmin * 6 + 'px';
  verdict.style.top = top + titleH + k.vmin * 7 + listH + rateH + k.vmin * 4 + 'px';
}
const T0 = 0.9;
const GAP = Math.min(0.85, Math.max(0.5, (S - 2.6) / 3));
const TR = T0 + 3 * GAP + 0.2;
rows.forEach((_, i) => cwSfx('pop', T0 + i * GAP, 0.7));
if (ratingText) cwSfx('sparkle', TR, 0.6);
if ($('verdict').textContent) cwSfx('success', TR + 0.7, 0.7);
window.cwFrame = (t) => {
  if (!laid) layout();
  const out = k.clamp((t - (S - 0.35)) / 0.35);
  const fade = 1 - k.ease.inCubic(out);
  titleLines.forEach((line, i) => {
    const p = k.ease.snap(k.clamp((t - 0.15 - i * 0.1) / 0.55));
    line.style.transform = 'translateY(' + (1 - p) * 105 + '%)';
    line.style.opacity = String(fade);
  });
  rows.forEach((row, i) => {
    const p = k.ease.outQuint(k.clamp((t - T0 - i * GAP) / 0.5));
    row.style.opacity = String(p * fade);
    row.style.transform = 'translateX(' + (1 - p) * -k.vmin * 8 + 'px)';
    const check = row.querySelector('path');
    check.setAttribute('stroke-dashoffset', String(100 - 100 * k.ease.inOutCubic(k.clamp((t - T0 - i * GAP - 0.25) / 0.35))));
  });
  const pr = k.ease.outCubic(k.clamp((t - TR) / 0.4));
  $('rating').style.opacity = String(pr * fade);
  $('fill').style.width = (ratingValue / 5) * 100 * k.ease.inOutCubic(k.clamp((t - TR - 0.1) / 0.6)) + '%';
  const pv = k.ease.outCubic(k.clamp((t - TR - 0.7) / 0.45));
  $('verdict').style.opacity = String(pv * fade);
  $('verdict').style.transform = 'translateY(' + (1 - pv) * k.vmin * 3 + 'px)';
};
</script>
</body>
</html>
